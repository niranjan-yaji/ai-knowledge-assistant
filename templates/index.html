<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Important for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Knowledge Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <header class="header">

            <div class="bot-icon">
                🤖
            </div>

            <div class="header-content">
                <h1>AI Knowledge Assistant</h1>

                <p>
                    Ask me about countries, companies,
                    technology, science and more.
                </p>
            </div>

        </header>


        <!-- Chat Messages -->
        <main class="chat-box" id="chatBox">

            <!-- Initial Bot Message -->
            <div class="message bot-message">

                <strong>AI Bot:</strong>

                <div>
                    Hello! 👋 Ask me anything.
                </div>

            </div>

        </main>


        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask something..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>


        <!-- Developer Information -->
        <footer class="developer">

            Developed by
            <strong>Niranjan Yaji</strong>

        </footer>

    </div>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
